<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Inter:wght@500;600&display=swap');
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 1200px; height: 630px; overflow: hidden;
    font-family: 'Inter', system-ui, sans-serif;
  }
  .wrap {
    width: 1200px; height: 630px;
    background: linear-gradient(160deg, #1a3fd6 0%, #0d1f66 100%);
    position: relative;
    display: flex; flex-direction: column; justify-content: center;
    padding: 0 90px;
  }
  .ridge {
    position: absolute; bottom: 0; left: 0; width: 100%; height: 70px;
  }
  .brand-row { display: flex; align-items: center; gap: 18px; margin-bottom: 46px; }
  .brand-row svg { width: 52px; height: 52px; }
  .brand-row span {
    font-family: 'Inter', sans-serif; font-weight: 600; font-size: 22px;
    letter-spacing: .06em; text-transform: uppercase; color: #ffd966;
  }
  h1 {
    font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 76px;
    color: #fff; margin: 0 0 22px; line-height: 1.08; max-width: 950px;
    text-shadow: -2px -2px 0 #0d1f66, 2px -2px 0 #0d1f66, -2px 2px 0 #0d1f66, 2px 2px 0 #0d1f66, 0 4px 0 #0d1f66;
  }
  p.tag {
    font-size: 30px; font-weight: 600; color: #eef2ff; margin: 0;
  }
  p.tag b { color: #ffd966; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand-row">
      <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M2 25L11 10L15.5 17L19 12L30 25H2Z" fill="#f2b705"/>
        <circle cx="23" cy="8" r="2.4" fill="#f2b705"/>
      </svg>
      <span>Aktivní Jablonec</span>
    </div>
    <h1>Nezávislí kandidáti pro Jablonec nad Jizerou.</h1>
    <p class="tag">Sdružení nezávislých kandidátů · <b>Komunální volby 2026</b></p>
    <svg class="ridge" viewBox="0 0 1200 70" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M0,70 L0,50 L150,20 L280,46 L420,10 L560,42 L720,16 L880,48 L1020,14 L1200,44 L1200,70 Z" fill="rgba(255,255,255,0.06)"/>
    </svg>
  </div>
</body>
</html>
